[project]
name = "call-me-maybe"
version = "1.0.0"
description = "Function calling via constrained decoding with a small local LLM"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
    "llm_sdk",
]

[tool.uv.sources]
llm_sdk = { path = "llm_sdk", editable = true }

[project.optional-dependencies]
dev = ["flake8>=7.0.0", "mypy>=1.8.0", "pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
