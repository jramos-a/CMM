[project]
name = "call-me-maybe"
version = "1.0.0"
description = "Function calling via constrained decoding with a small local LLM"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
    "llm_sdk",
]

[tool.uv.sources]
llm_sdk = { path = "llm_sdk", editable = true }

[dependency-groups]
dev = ["flake8>=7.0.0", "mypy>=1.8.0", "pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
ignore_missing_imports = true
exclude = ["^llm_sdk/", "^venv/", "^\\.venv/"]

[[tool.mypy.overrides]]
module = ["llm_sdk", "llm_sdk.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: tests that load the real LLM (slow, need the weights)"]
